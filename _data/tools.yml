# 직접 만든 도구
- name: daily-hub
  stack: Next.js · Vercel · Google Calendar
  description: 일정, 일별 주요 뉴스, TODO를 한 화면에 모은 웹 대시보드. 모바일에서도 확인할 수 있게 만들었습니다.
- name: ScheduleTodoManager
  stack: WPF (.NET 8) · Notion
  description: 일정 관리 데스크톱 앱. AI·주식 동향 리포트를 모아 Notion에 자동으로 기록합니다.
- name: 코드 그래프 자동 갱신
  stack: Graphify · cron · Obsidian
  description: AI가 파일을 통째로 읽기 전에 코드 그래프에서 위치를 먼저 찾게 해 토큰 사용을 줄였습니다. 10분마다 자동 갱신합니다.
- name: AI 에이전트 규칙 체계
  stack: CLAUDE.md · AGENTS.md · Obsidian
  description: 흩어진 에이전트 규칙을 전역·저장소·프로젝트 3단으로 통합하고, 작업이 끝나면 Obsidian에 자동 기록되게 했습니다.
